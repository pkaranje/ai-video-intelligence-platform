[project]
name = "shared"
version = "0.1.0"
description = "Shared library for AI Video Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7",
    "dramatiq>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[dependency-groups]
dev = ["ruff>=0.4"]
